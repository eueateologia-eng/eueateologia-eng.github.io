<title>Painel Eu e a Teologia</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: painel de gestão; cabeçalho com logo, abas em linha, conteúdo em cartões; resumo antes do detalhe */
:root{
  --bg:#faf6eb; --surface:#fffdf8; --sunk:#f4ecdc; --ink:#3d2314; --muted:#7a5e4c; --line:#ead9c2;
  --terra:#b0563a; --terra-soft:#f6e5d6; --on-terra:#fffdf8; --sand:#f2dec3; --brown:#4a2716;
  --ok:#3f6b3a; --ok-soft:#e4efdc; --warn:#8a5a00; --warn-soft:#f8ebc8; --no:#a1402a; --no-soft:#f6e0d8;
  --font:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1e1510;--surface:#2a1d16;--sunk:#241912;--ink:#f4e8d8;--muted:#c6ab95;--line:#402e23;
  --terra:#e48b6b;--terra-soft:#3b241a;--on-terra:#1e1510;--sand:#3a2b1f;--brown:#f4e8d8;
  --ok:#9fd08f;--ok-soft:#203321;--warn:#f0c76a;--warn-soft:#3a2e14;--no:#f0a08c;--no-soft:#3d1f17;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1e1510;--surface:#2a1d16;--sunk:#241912;--ink:#f4e8d8;--muted:#c6ab95;--line:#402e23;
  --terra:#e48b6b;--terra-soft:#3b241a;--on-terra:#1e1510;--sand:#3a2b1f;--brown:#f4e8d8;
  --ok:#9fd08f;--ok-soft:#203321;--warn:#f0c76a;--warn-soft:#3a2e14;--no:#f0a08c;--no-soft:#3d1f17;color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:16px 48px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(24px,4vw,30px)} h2{font-size:20px} h3{font-size:16px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--terra);font-weight:700}
.logo{height:46px;width:auto;display:block}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo{background:#faf6eb;border-radius:10px;padding:4px 8px}}
:root[data-theme="dark"] .logo{background:#faf6eb;border-radius:10px;padding:4px 8px}

.btn{appearance:none;border:0;cursor:pointer;font:700 14px/1 var(--font);padding:12px 18px;border-radius:999px;background:var(--terra);color:var(--on-terra);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--terra);border:1.5px solid var(--terra)}
.btn.quiet{background:var(--sunk);color:var(--ink)}
.btn.danger{background:var(--no-soft);color:var(--no)}
.btn.sm{padding:8px 12px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.seg button:focus-visible{outline:3px solid var(--terra);outline-offset:2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}

/* Login */
.login{max-width:420px;margin:6vh auto 0;display:flex;flex-direction:column;gap:18px}
.login .logo{height:96px;align-self:center}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
input,select,textarea{font:500 15px/1.4 var(--font);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:90px;resize:vertical}
.msg{font-size:14px;border-radius:10px;padding:10px 12px}
.msg.err{background:var(--no-soft);color:var(--no)} .msg.ok{background:var(--ok-soft);color:var(--ok)} .msg.info{background:var(--sand);color:var(--ink)}
.linkbtn{appearance:none;background:none;border:0;color:var(--terra);font:600 14px var(--font);cursor:pointer;padding:0;text-decoration:underline}

/* Topo e abas */
.main{display:flex;flex-direction:column;gap:16px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);padding-bottom:0}
.tab{appearance:none;background:none;border:0;border-bottom:3px solid transparent;font:700 14px var(--font);color:var(--muted);padding:10px 12px 12px;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--terra);border-bottom-color:var(--terra)}
.demo{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600}

/* Indicadores */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .l{font-size:13px;color:var(--muted);font-weight:600}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.hero{background:var(--terra);border-color:var(--terra);color:var(--on-terra)}
.kpi.hero .l,.kpi.hero .s{color:var(--on-terra);opacity:.85}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{appearance:none;border:0;background:var(--surface);color:var(--muted);font:700 13px var(--font);padding:8px 14px;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg)}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
@media (max-width:820px){.two{grid-template-columns:1fr}}

/* Gráfico */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{font:600 11px var(--font);fill:var(--muted)}
.chart .bar{fill:var(--terra)}
.chart .bar.hl{fill:var(--brown)}
.chart .hit{fill:transparent;cursor:pointer}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;font-weight:600;padding:6px 10px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s}
.tip.on{opacity:1}

/* Listas com barra */
.hbars{display:flex;flex-direction:column;gap:10px;list-style:none;margin:0;padding:0}
.hbars li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:14px}
.hbars .track{grid-column:1/-1;height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.hbars .fill{height:100%;border-radius:4px;background:var(--terra)}
.hbars .n{font-weight:700;font-variant-numeric:tabular-nums}
.hbars .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{font-size:14px;color:var(--muted);background:var(--sunk);border-radius:10px;padding:14px;text-align:center}

/* Tabelas */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--sunk);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.no{background:var(--no-soft);color:var(--no)}
.pill.terra{background:var(--terra-soft);color:var(--terra)}

/* Formulários */
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.form .full{grid-column:1/-1}
@media (max-width:640px){.form{grid-template-columns:1fr}}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}

/* Achados */
.items{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.item.off{opacity:.55}
.thumb{width:64px;height:64px;border-radius:10px;background:var(--sand);overflow:hidden;display:grid;place-items:center;color:var(--terra);font-weight:800}
.thumb img{width:100%;height:100%;object-fit:cover}
.item h3{font-size:15px;margin-bottom:2px}
.item .meta{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:640px){.item{grid-template-columns:52px minmax(0,1fr)}.thumb{width:52px;height:52px}.item .acts{grid-column:1/-1;justify-content:flex-start}}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;flex-direction:row}
.switch input{width:auto}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.loading{padding:40px;text-align:center;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const DEMO = !SB_URL || SB_URL.startsWith("__");
const sb = (!DEMO && window.supabase) ? window.supabase.createClient(SB_URL, SB_KEY) : null;
const $ = id => document.getElementById(id);
const root = $("root");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl = n => (Number(n)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const num = n => (Number(n)||0).toLocaleString("pt-BR");
const fmtDate = d => { if(!d) return ""; const [y,m,dd] = String(d).slice(0,10).split("-"); return `${dd}/${m}/${y}`; };
const today = () => new Date(Date.now() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
let toastT; function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("on"),2600); }

function errText(e){
  const m = (e && (e.message||e.error_description||String(e))) || "Erro desconhecido";
  if(/Invalid login/i.test(m)) return "E-mail ou senha incorretos.";
  if(/Email not confirmed/i.test(m)) return "Este e-mail ainda não foi confirmado. Abra o convite que chegou no e-mail.";
  if(/acesso negado|permission|row-level/i.test(m)) return "Este usuário não tem permissão para essa ação.";
  if(/Failed to fetch|NetworkError/i.test(m)) return "Sem conexão com o servidor. Verifique a internet e tente de novo.";
  if(/should be at least/i.test(m)) return "A senha precisa ter pelo menos 6 caracteres.";
  return m;
}

/* ===================== DADOS: Supabase ===================== */
const API_SB = {
  async session(){ const {data} = await sb.auth.getSession(); return data.session; },
  async signIn(email,pw){ const {error} = await sb.auth.signInWithPassword({email,password:pw}); if(error) throw error; },
  async signOut(){ await sb.auth.signOut(); },
  async resetPw(email){ const {error} = await sb.auth.resetPasswordForEmail(email,{redirectTo: location.origin+location.pathname}); if(error) throw error; },
  async updatePw(pw){ const {error} = await sb.auth.updateUser({password:pw}); if(error) throw error; },
  async isAdmin(){ const {data,error} = await sb.rpc("is_admin"); if(error) throw error; return !!data; },
  async resumo(dias){ const {data,error} = await sb.rpc("painel_resumo",{dias}); if(error) throw error; return data; },
  async all(t,order,asc=true){ const {data,error} = await sb.from(t).select("*").order(order,{ascending:asc}).limit(1000); if(error) throw error; return data||[]; },
  async save(t,row){ const {id,...rest} = row; const q = id ? sb.from(t).update(rest).eq("id",id) : sb.from(t).insert(rest); const {data,error} = await q.select().single(); if(error) throw error; return data; },
  async del(t,id){ const {error} = await sb.from(t).delete().eq("id",id); if(error) throw error; },
  async config(){ const {data,error} = await sb.from("config").select("*"); if(error) throw error; return Object.fromEntries((data||[]).map(r=>[r.chave,r.valor])); },

async function boot(){

}

  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Pessoas por dia">
    ${ticks.map(t=>`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}"/><text class="axis" x="${pl-6}" y="${y(t)+4}" text-anchor="end">${num(t)}</text>`).join("")}
    ${serie.map((s,i)=>{const x=pl+i*bw+gap/2, w=Math.max(1,bw-gap), h=Math.max(0,y(0)-y(s.visitantes)), r=Math.min(4,w/2,h);
      const path = h>0?`M${x} ${y(0)} V${y(0)-h+r} Q${x} ${y(0)-h} ${x+r} ${y(0)-h} H${x+w-r} Q${x+w} ${y(0)-h} ${x+w} ${y(0)-h+r} V${y(0)} Z`:"";
      return `${path?`<path class="bar" d="${path}" data-i="${i}"/>`:""}${(i%every===0 && (n-1-i)>=every*0.7)||i===n-1?`<text class="axis" x="${x+w/2}" y="${H-8}" text-anchor="middle">${lbl(s)}</text>`:""}<rect class="hit" x="${pl+i*bw}" y="${pt}" width="${bw}" height="${H-pt-pb}" data-i="${i}"/>`;}).join("")}
  </svg><div class="tip" id="tip"></div>`;
  const tip=el.querySelector("#tip"), svg=el.querySelector("svg");
  const show = i => { const s=serie[i]; const rect=svg.getBoundingClientRect(), k=rect.width/W;
    tip.innerHTML=`${fmtDate(s.dia)} · <strong>${num(s.visitantes)}</strong> pessoas · ${num(s.acessos)} acessos`;
    tip.style.left=(pl+(i+.5)*bw)*k+"px"; tip.style.top=y(s.visitantes)*k+"px"; tip.classList.add("on");
    el.querySelectorAll(".bar").forEach(b=>b.classList.toggle("hl",+b.dataset.i===i)); };
  el.querySelectorAll(".hit").forEach(h=>{ h.addEventListener("mouseenter",()=>show(+h.dataset.i)); h.addEventListener("click",()=>show(+h.dataset.i)); });
  svg.addEventListener("mouseleave",()=>{ tip.classList.remove("on"); el.querySelectorAll(".bar").forEach(b=>b.classList.remove("hl")); });
}

        <label>Item<select id="v-item"><option value="">Outro (descrever abaixo)</option>${A.map(a=>`<option value="${a.id}" ${e?.achado_id===a.id?'selected':''}>${esc(a.nome)}</option>`).join("")}</select></label>
        <label class="full">Descrição<input id="v-desc" required value="${esc(e?.descricao||"")}" placeholder="Ex.: Atlas bíblico, pedido 1234"></label>
        <label>Canal<select id="v-canal">${Object.entries(CANAL).map(([k,l])=>`<option value="${k}" ${(e?.canal||"afiliado")===k?'selected':''}>${l}</option>`).join("")}</select></label>
        <label>Plataforma<input id="v-plat" list="plats" value="${esc(e?.plataforma||"")}" placeholder="Amazon, Shopee, WhatsApp…"><datalist id="plats"><option>Amazon</option><option>Shopee</option><option>Mercado Livre</option><option>Magalu</option><option>WhatsApp</option><option>Loja virtual</option></datalist></label>
        <label>Valor da venda (R$)<input id="v-valor" type="number" step="0.01" min="0" inputmode="decimal" value="${e?.valor??""}"></label>
        <label>Comissão ou lucro (R$)<input id="v-com" type="number" step="0.01" min="0" inputmode="decimal" value="${e?.comissao??""}"></label>
        <label>Situação<select id="v-status">${Object.entries(STATUS).map(([k,[l]])=>`<option value="${k}" ${(e?.status||"confirmada")===k?'selected':''}>${l}</option>`).join("")}</select></label>
        <label>Observação<input id="v-obs" value="${esc(e?.obs||"")}"></label>

  bindRowActions(V,"vendas",viewVendas);
}

/* Excluir com confirmação na própria página */
function bindRowActions(list,table,refresh){
  view().querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{ ST.edit=list.find(x=>x.id===b.dataset.edit); ST.editT=table; refresh(); setTimeout(()=>{const f=view().querySelector(".card form"); f && f.closest(".card").scrollIntoView({behavior:"smooth",block:"start"});},50); });
  view().querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
    if(b.dataset.armed!=="1"){ b.dataset.armed="1"; const t=b.textContent; b.textContent="Confirmar"; setTimeout(()=>{ if(b.isConnected){ b.dataset.armed=""; b.textContent=t; } },3500); return; }
    try{ await API.del(table,b.dataset.del); toast("Excluído"); refresh(); }catch(err){ toast(errText(err)); } });
}

/* ===================== TRILHA ===================== */
async function viewTrilha(){
  loading(); let D;
  try{ D = (await API.all("trilha_dias","dia")).sort((a,b)=>a.semana-b.semana||a.dia-b.dia); }catch(e){ return fail(e); }
  const e = ST.editT==="trilha_dias" ? ST.edit : null;
  const semanas = [...new Set(D.map(d=>d.semana))];
  const nextWeek = (semanas.at(-1)||0)+1;
  view().innerHTML = `
    <div class="row between"><div><p class="eyebrow">Trilha diária</p><h1>Conteúdo dos dias</h1>
      <p class="muted small" style="margin-top:6px;max-width:70ch">O app mostra a semana publicada de número mais alto. Prepare a próxima semana com os dias ocultos e publique quando estiver pronta.</p></div>
      <button class="btn" id="t-new">Adicionar dia</button></div>
    ${e!==null && ST.editT==="trilha_dias" ? `<section class="card"><h2>${e?.id?`Editar Semana ${e.semana} · Dia ${e.dia}`:"Novo dia"}</h2>
      <form class="form" id="f-tri" novalidate>
        <label>Semana<input id="t-sem" type="number" min="1" value="${e?.semana??(semanas.at(-1)||1)}"></label>
        <label>Dia (1 a 7)<input id="t-dia" type="number" min="1" max="7" value="${e?.dia??1}"></label>
        <label class="full">Tema da semana<input id="t-stit" value="${esc(e?.semana_titulo||D.find(x=>x.semana===(e?.semana??semanas.at(-1)))?.semana_titulo||"")}" placeholder="Ex.: Como ler a Bíblia"></label>
        <label class="full">Título do dia<input id="t-tit" value="${esc(e?.titulo||"")}"></label>
        <label>Leitura (referência)<input id="t-ref" value="${esc(e?.referencia||"")}" placeholder="Ex.: Salmo 23"></label>
        <label>Frase para o card de stories<input id="t-post" value="${esc(e?.frase_post||"")}"></label>
        <label class="full">Versículo em destaque<textarea id="t-ver" style="min-height:60px">${esc(e?.versiculo||"")}</textarea></label>
        <label class="full">Contexto (deixe uma linha em branco entre os parágrafos)<textarea id="t-ctx" style="min-height:140px">${esc(e?.contexto||"")}</textarea></label>
        <label class="full">Pergunta para pensar<input id="t-perg" value="${esc(e?.pergunta||"")}"></label>
        <label class="full">Prática de hoje<input id="t-prat" value="${esc(e?.pratica||"")}"></label>
        <label class="switch"><input type="checkbox" id="t-pub" ${e?.publicado!==false?"checked":""}> Publicado no app</label>
        <div class="actions full"><button type="button" class="btn quiet" id="t-cancel">Cancelar</button><button class="btn" type="submit">${e?.id?"Salvar alterações":"Adicionar dia"}</button></div>
      </form></section>`:""}
    ${semanas.length?semanas.map(s=>{const ds=D.filter(d=>d.semana===s);const pub=ds.filter(d=>d.publicado).length;return `<section class="card">
      <div class="row between"><h2>Semana ${s} · ${esc(ds[0]?.semana_titulo||"")}</h2><span class="pill ${pub===ds.length?"ok":pub?"warn":""}">${pub} de ${ds.length} publicados</span></div>
      <div class="tablewrap"><table><thead><tr><th>Dia</th><th>Título</th><th>Leitura</th><th>Situação</th><th></th></tr></thead><tbody>
      ${ds.map(d=>`<tr><td>${d.dia}</td><td>${esc(d.titulo)}</td><td>${esc(d.referencia||"")}</td><td><span class="pill ${d.publicado?"ok":""}">${d.publicado?"Publicado":"Oculto"}</span></td>
        <td class="num"><button class="btn quiet sm" data-pub="${d.id}">${d.publicado?"Ocultar":"Publicar"}</button> <button class="btn quiet sm" data-edit="${d.id}">Editar</button> <button class="btn danger sm" data-del="${d.id}">Excluir</button></td></tr>`).join("")}
      </tbody></table></div></section>`}).join(""):`<p class="empty">Nenhum dia cadastrado.</p>`}`;
  $("t-new").onclick=()=>{ const last=D.filter(d=>d.semana===(semanas.at(-1)||1)); ST.edit = last.length>=7 ? {semana:nextWeek,dia:1,publicado:false} : {semana:semanas.at(-1)||1,dia:last.length+1,semana_titulo:last[0]?.semana_titulo}; ST.editT="trilha_dias"; viewTrilha(); };
  if($("t-cancel")) $("t-cancel").onclick=()=>{ ST.edit=null; viewTrilha(); };
  if($("f-tri")) $("f-tri").onsubmit = async ev => { ev.preventDefault();
    const tit=$("t-tit").value.trim(); if(!tit){ $("t-tit").focus(); return toast("Escreva o título do dia"); }
    const row={ semana:Number($("t-sem").value||1), dia:Math.min(7,Math.max(1,Number($("t-dia").value||1))), semana_titulo:$("t-stit").value.trim()||"Trilha", titulo:tit,
      referencia:$("t-ref").value.trim()||null, versiculo:$("t-ver").value.trim()||null, contexto:$("t-ctx").value.trim()||null, pergunta:$("t-perg").value.trim()||null,
      pratica:$("t-prat").value.trim()||null, frase_post:$("t-post").value.trim()||null, publicado:$("t-pub").checked };

    try{ await API.save("trilha_dias",{id:d.id,publicado:!d.publicado}); toast(d.publicado?"Dia ocultado":"Dia publicado"); viewTrilha(); }catch(err){ toast(errText(err)); } });
  bindRowActions(D,"trilha_dias",viewTrilha);
}
