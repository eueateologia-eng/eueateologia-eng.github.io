<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Eu e a Teologia</title>
<meta name="description" content="Trilha diária, quiz, biblioteca infantil e mapa bíblico, com Juliana Tasca.">
<meta name="theme-color" content="#b0563a">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Eu e a Teologia">
<meta property="og:title" content="Eu e a Teologia">
<meta property="og:description" content="Trilha diária, quiz, biblioteca infantil e mapa bíblico, com Juliana Tasca.">
<meta property="og:image" content="./logo-eueateologia.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app de celular em uma coluna; barra de abas fixa embaixo; cada dia da trilha é uma "tabuinha" com leitura, contexto e prática */
:root{
  --bg:#f3f1ec; --surface:#fbfaf7; --ink:#1c2238; --muted:#5d6278; --line:#dcd8cf;
  --lapis:#27408b; --lapis-soft:#e4e8f4; --on-lapis:#fbfaf7;
  --gold:#9a6f1e; --gold-soft:#f3ead6;
  --ok:#2f6b4a; --ok-soft:#e2efe7; --no:#9a3b2f; --no-soft:#f5e3df;
  --display:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12162a;--surface:#1a1f36;--ink:#ece9e1;--muted:#a3a7bb;--line:#2e3452;
  --lapis:#9db1ee;--lapis-soft:#232c52;--on-lapis:#12162a;--gold:#d9b366;--gold-soft:#2e2818;
  --ok:#8fd0aa;--ok-soft:#1b3328;--no:#eba196;--no-soft:#3a201c;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12162a;--surface:#1a1f36;--ink:#ece9e1;--muted:#a3a7bb;--line:#2e3452;
  --lapis:#9db1ee;--lapis-soft:#232c52;--on-lapis:#12162a;--gold:#d9b366;--gold-soft:#2e2818;
  --ok:#8fd0aa;--ok-soft:#1b3328;--no:#eba196;--no-soft:#3a201c;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;padding-inline:18px;padding-block:20px calc(96px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.12;text-wrap:balance;margin:0}
p{margin:0}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
.muted{color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.top b{font-family:var(--display);font-style:italic;font-size:22px;font-weight:600;color:var(--lapis)}
.streak{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;background:var(--gold-soft);color:var(--gold);padding:6px 12px;border-radius:999px;font-variant-numeric:tabular-nums}

.btn{appearance:none;border:0;cursor:pointer;font:600 16px/1 var(--body);padding:15px 20px;border-radius:999px;background:var(--lapis);color:var(--on-lapis);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.ghost{background:transparent;color:var(--lapis);border:1.5px solid var(--lapis)}
.btn.block{width:100%}
.btn:focus-visible,.opt:focus-visible,.tab:focus-visible,.row:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:22px 20px;display:flex;flex-direction:column;gap:16px}
.hero h1{font-size:clamp(34px,9vw,46px)}
.ref{font-size:13px;color:var(--gold);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.key{font-family:var(--display);font-style:italic;font-size:24px;line-height:1.25}
.sec{display:flex;flex-direction:column;gap:6px}
.sec h3{font-family:var(--body);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sec p+p{margin-top:8px}
.practice{background:var(--lapis-soft);border-radius:8px;padding:16px}
.practice h3{color:var(--lapis)}
.done-badge{display:inline-flex;gap:6px;align-items:center;font-weight:700;color:var(--ok);font-size:15px}

/* Semana */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week span{aspect-ratio:1;max-width:100%;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;border:1.5px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.week span.d{background:var(--lapis);border-color:var(--lapis);color:var(--on-lapis)}
.week span.n{border-color:var(--gold);color:var(--gold)}

/* Lista da trilha */
.list{display:flex;flex-direction:column;gap:8px}
.row{appearance:none;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;gap:14px;align-items:center;cursor:pointer;width:100%}
.row .num{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;border:1.5px solid var(--line);color:var(--muted)}
.row.d .num{background:var(--lapis);border-color:var(--lapis);color:var(--on-lapis)}
.row .t{min-width:0;flex:1}
.row .t strong{display:block;font-size:16px}
.row .t span{font-size:13px;color:var(--muted)}

/* Quiz */
.progress{display:flex;gap:6px}
.progress i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.progress i.done{background:var(--lapis)} .progress i.now{background:var(--gold)}
blockquote{margin:0;font-family:var(--display);font-style:italic;font-size:clamp(24px,6vw,30px);line-height:1.22;font-weight:500}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{appearance:none;text-align:left;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:13px 15px;cursor:pointer;display:flex;gap:12px}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.right .k{color:var(--ok)}
.opt.wrong{border-color:var(--no);background:var(--no-soft)} .opt.wrong .k{color:var(--no)}
.opt.dim{opacity:.55}
.verdict{font-weight:700}.verdict.ok{color:var(--ok)}.verdict.no{color:var(--no)}
.note{background:var(--gold-soft);border-radius:8px;padding:14px 16px;font-size:15px}

/* Explorar */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile strong{font-family:var(--display);font-size:22px;line-height:1.1}
.tile span{font-size:13px;color:var(--muted)}
.tile em{font-style:normal;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}
@media (max-width:380px){.grid{grid-template-columns:1fr}}

/* Card para postar */
.sheet{position:fixed;inset:0;background:rgba(30,21,16,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet .in{background:var(--surface);border-radius:14px;padding:18px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto}
.sheet img{width:62%;max-width:100%;align-self:center;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.small{font-size:13px;color:var(--muted)}
/* Biblioteca */
.tile-btn{appearance:none;text-align:left;font:inherit;color:var(--ink);cursor:pointer;border-color:var(--gold)}
.tile-btn:focus-visible,.age:focus-visible,.bk:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ages{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.age{appearance:none;flex:none;font:600 14px/1 var(--body);padding:11px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.age.on{background:var(--lapis);border-color:var(--lapis);color:var(--on-lapis)}
.shelf{display:flex;flex-direction:column;gap:10px}
.bk{appearance:none;font:inherit;color:var(--ink);text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0;display:flex;align-items:stretch;overflow:hidden;cursor:pointer;width:100%}
.bk[disabled]{cursor:default;opacity:.6}
.bk .spine{flex:none;width:14px;background:var(--c)}
.bk .t{flex:1;min-width:0;padding:14px 12px}
.bk .t strong{display:block;font-family:var(--display);font-size:21px;line-height:1.15}
.bk .t span{font-size:13px;color:var(--muted)}
.bk em{font-style:normal;align-self:center;padding:0 16px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.cover{background:var(--c);color:#fbfaf7;border-radius:6px;padding:26px 20px;display:flex;flex-direction:column;gap:6px}
.cover span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.85;font-weight:600}
.cover strong{font-family:var(--display);font-size:clamp(28px,7vw,36px);line-height:1.1;font-weight:600}
.cover em{font-size:14px;opacity:.85}
.page-text{min-height:5em}
.ill{margin:0;border-radius:10px;overflow:hidden;aspect-ratio:400/260;max-width:100%;background:#bfe0f2;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.ill svg{display:block;width:100%;height:100%}
.bk .thumb{flex:none;width:96px;align-self:stretch;overflow:hidden;background:#bfe0f2}
.bk .thumb svg{display:block;width:100%;height:100%;min-height:72px}
.book.tiny .page-text{font-family:var(--display);font-size:clamp(28px,7.5vw,36px);line-height:1.25;font-weight:600}
.book.kid .page-text{font-size:20px;line-height:1.6}
.book.teen .page-text{font-size:17px;line-height:1.7}
.asks{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pager .btn{padding:13px 18px}
.pager .btn[disabled]{opacity:.35;cursor:default}
.pg{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
/* Mapa */
:root{--m-land:#ece2c8;--m-sea:#9cc3df;--m-water:#7fb0d6;--m-hill:#d9cfa8;--m-ink:#4a3f2e;--m-route:#9a3b2f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--m-land:#2a2e3e;--m-sea:#1e3552;--m-water:#2c5480;--m-hill:#343a4a;--m-ink:#d9d2bf;--m-route:#eba196}}
:root[data-theme="dark"]{--m-land:#2a2e3e;--m-sea:#1e3552;--m-water:#2c5480;--m-hill:#343a4a;--m-ink:#d9d2bf;--m-route:#eba196}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;align-self:flex-start}
.seg button{appearance:none;border:0;background:var(--surface);color:var(--muted);font:600 14px/1 var(--body);padding:10px 16px;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg)}
.mapbox{margin:0;display:flex;flex-direction:column;gap:6px}
.map{width:100%;max-width:100%;height:auto;display:block;border-radius:10px;border:1px solid var(--line)}
.mapbox figcaption{font-size:12px;color:var(--muted)}
.m-land{fill:var(--m-land)} .m-sea{fill:var(--m-sea)} .m-water{fill:var(--m-water)} .m-hill{fill:var(--m-hill)}
.m-river{fill:none;stroke:var(--m-water);stroke-width:3;stroke-linejoin:round}
.m-sea-t{font:italic 600 15px var(--display);fill:var(--m-ink);opacity:.75}
.m-w-t{font:italic 600 12px var(--display);fill:var(--m-ink)}
.m-prov{font:700 11px var(--body);letter-spacing:.2em;fill:var(--m-ink);opacity:.55}
.m-pt circle{fill:var(--m-ink)} .m-pt text{font:600 12px var(--body);fill:var(--m-ink)} .m-pt text.sm{font-size:10px}
.m-pt.big{cursor:pointer} .m-pt.big circle{fill:var(--m-route);stroke:var(--m-land);stroke-width:3} .m-pt.big text{font-size:14px;font-weight:700}
.m-valley{fill:none;stroke:var(--m-water);stroke-width:2.5;stroke-dasharray:2 4;stroke-linecap:round;opacity:.9}
.m-wall-then{fill:rgba(154,111,30,.10);stroke:var(--gold);stroke-width:2.5;stroke-dasharray:7 5}
.m-wall-then.faint{opacity:.45}
.m-wall-now{fill:rgba(39,64,139,.08);stroke:var(--lapis);stroke-width:3.5}
.m-temple{fill:rgba(154,111,30,.28);stroke:var(--gold);stroke-width:1.5}
.m-dolorosa{fill:none;stroke:var(--lapis);stroke-width:3;stroke-dasharray:1 6;stroke-linecap:round}
.m-area{font:700 9.5px var(--body);letter-spacing:.14em;fill:var(--m-ink);opacity:.7}
.m-vt{font:italic 600 12px var(--display);fill:var(--m-ink);opacity:.85}
.m-route{fill:none;stroke:var(--m-route);stroke-width:2.5;stroke-dasharray:5 4;opacity:.85}
.m-step{cursor:pointer} .m-step circle{fill:var(--surface);stroke:var(--m-route);stroke-width:2.5}
.m-step text{font:700 12px var(--body);fill:var(--m-route)}
.m-step.on circle{fill:var(--m-route)} .m-step.on text{fill:var(--surface)}
.m-cross{fill:none;stroke:var(--m-route);stroke-width:2.6;stroke-linecap:round} .m-step.on .m-cross{stroke:var(--surface)}
.m-step:focus-visible circle{stroke:var(--gold);stroke-width:4}
.m-alt circle{fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:3 3} .m-alt text{font:600 10px var(--body);fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{display:inline-block;width:22px;height:0;border-top:3px solid}
.lg.route{border-color:var(--m-route);border-top-style:dashed} .lg.then{border-color:var(--gold);border-top-style:dashed} .lg.now{border-color:var(--lapis)} .lg.dolo{border-color:var(--lapis);border-top-style:dotted}
.stop-h{display:flex;gap:14px;align-items:flex-start}
.stop-h h2{font-size:clamp(24px,6vw,30px)}
.badge{flex:none;width:40px;height:40px;border-radius:50%;background:var(--m-route);color:var(--surface);display:grid;place-items:center;font-weight:700;font-size:17px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair div{background:var(--bg);border-radius:8px;padding:10px 12px;min-width:0}
.pair span{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.pair strong{font-size:14px;line-height:1.35;display:block}
@media (max-width:380px){.pair{grid-template-columns:1fr}}
.co{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.co a{color:var(--lapis)}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plist li{display:flex;flex-direction:column;padding-block:8px;border-top:1px solid var(--line);font-size:14px}
.plist li span{color:var(--muted);font-size:13px}
.nets{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.net{display:flex;align-items:center;justify-content:center;padding:12px 8px;border-radius:10px;background:var(--lapis-soft);color:var(--lapis);font-weight:600;font-size:14px;text-decoration:none}
.net:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* Abas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:560px}
.tab{appearance:none;background:none;border:0;font:600 12px/1.2 var(--body);color:var(--muted);padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tab.on{color:var(--lapis)}
.demo{font-size:12px;color:var(--muted);text-align:center}


/* Achadinho */
.ach-ex{font-size:13px;color:var(--muted);background:var(--gold-soft);border-radius:8px;padding:8px 12px}
.ach-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ach{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.ach-img{position:relative;aspect-ratio:4/3;max-width:100%;background:var(--gold-soft);display:grid;place-items:center;overflow:hidden}
.ach-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.ach-img svg{width:44%;height:44%;fill:none;stroke:var(--lapis);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.ach-body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.ach-body h3{font-size:19px;line-height:1.2}
.ach-tipo{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:var(--lapis-soft);color:var(--lapis)}
.ach-tipo.t-uso{background:var(--ok-soft);color:var(--ok)}
.ach-tipo.t-loja{background:var(--ink);color:var(--bg)}
.ach-nota{font-size:14px;color:var(--muted);flex:1}
.ach-meta{font-size:13px;color:var(--muted)} .ach-meta strong{color:var(--ink)}
.ach-btn{padding:13px 16px;font-size:15px;margin-top:4px}
.ach-soon{font-size:13px;font-weight:700;color:var(--muted);text-align:center;padding:12px;border:1.5px dashed var(--line);border-radius:999px}
.ach-aviso{font-size:12px;color:var(--muted);text-align:center;padding-inline:8px}
@media (max-width:420px){.ach-grid{grid-template-columns:1fr}.ach{flex-direction:row}.ach-img{flex:none;width:112px;aspect-ratio:auto;align-self:stretch;min-height:150px}.ach-body{padding:12px}.ach-body h3{font-size:17px}.ach-nota{font-size:13px}.ach-btn{padding:11px 12px;font-size:14px}}
/* ===== Identidade da logo: terracota, areia e marrom ===== */
:root{
  --bg:#faf6eb; --surface:#fffdf8; --ink:#3d2314; --muted:#7a5e4c; --line:#ead9c2;
  --lapis:#b0563a; --lapis-soft:#f6e5d6; --on-lapis:#fffdf8;
  --gold:#9a6a3e; --gold-soft:#f2dec3;
  --ok:#3f6b3a; --ok-soft:#e4efdc; --no:#a1402a; --no-soft:#f6e0d8;
  --display:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1e1510;--surface:#2a1d16;--ink:#f4e8d8;--muted:#c6ab95;--line:#402e23;
  --lapis:#e48b6b;--lapis-soft:#3b241a;--on-lapis:#1e1510;--gold:#e2b78c;--gold-soft:#3a2b1f;
  --ok:#9fd08f;--ok-soft:#203321;--no:#f0a08c;--no-soft:#3d1f17;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1e1510;--surface:#2a1d16;--ink:#f4e8d8;--muted:#c6ab95;--line:#402e23;
  --lapis:#e48b6b;--lapis-soft:#3b241a;--on-lapis:#1e1510;--gold:#e2b78c;--gold-soft:#3a2b1f;
  --ok:#9fd08f;--ok-soft:#203321;--no:#f0a08c;--no-soft:#3d1f17;color-scheme:dark}
h1,h2,h3{font-weight:800;letter-spacing:-.02em}
blockquote,.key{font-style:normal;font-weight:700;letter-spacing:-.01em}
.book.tiny .page-text,.cover strong,.tile strong,.bk .t strong{font-weight:800;letter-spacing:-.01em}
.logo{height:48px;width:auto;display:block}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo{background:#faf6eb;border-radius:10px;padding:4px 8px}}
:root[data-theme="dark"] .logo{background:#faf6eb;border-radius:10px;padding:4px 8px}
</style>

<script>
/* ================= CONFIGURAÇÃO ================= */
const IG = "@eueateologia";                 // Instagram oficial da página
const APP_URL = () => location.href.split("#")[0]; // trocar pelo endereço definitivo do app

/* ================= CONTEÚDO (rascunho para revisão da Juliana) ================= */
const WEEK = {
  title:"Semana 1 · Como ler a Bíblia",
  days:[
    {title:"A Bíblia é uma biblioteca", ref:"Lucas 24:25-27",
     key:"Começando por Moisés e todos os profetas, Jesus explicou o que as Escrituras diziam a respeito dele.",
     ctx:["A Bíblia não é um livro só. São 66 livros, escritos ao longo de cerca de 1.500 anos, em três línguas: hebraico, aramaico e grego.",
          "Há narrativa, lei, poesia, profecia, cartas e apocalipse. Cada gênero pede uma forma diferente de leitura, e mesmo assim todos apontam para a mesma história."],
     ask:"Quando abro a Bíblia, costumo perguntar que tipo de texto estou lendo?",
     act:"Abra o sumário da sua Bíblia e tente marcar quais livros são narrativa, poesia, profecia e cartas.",
     post:"A Bíblia é uma biblioteca inteira contando uma só história."},
    {title:"Quem escreveu e para quem", ref:"Filipenses 1:1-11",
     key:"Paulo e Timóteo, servos de Cristo Jesus, a todos os santos que estão em Filipos.",
     ctx:["Toda carta do Novo Testamento tem remetente, destinatário e um motivo. Filipos era uma colônia romana, cheia de ex-soldados, orgulhosa da cidadania romana.",
          "Por isso Paulo diz, mais adiante, que a cidadania dos cristãos está nos céus (3:20). A frase tinha um peso enorme para aqueles leitores."],
     ask:"Antes de perguntar o que o texto diz para mim, eu pergunto o que ele dizia para eles?",
     act:"Leia Filipenses 1:1-11 e anote três coisas: quem escreve, para quem, e por que está escrevendo.",
     post:"Antes de perguntar o que o texto diz para mim, pergunto o que ele dizia para eles."},
    {title:"Nenhum versículo vive sozinho", ref:"Jeremias 29:1-14",
     key:"Construam casas e habitem nelas; plantem pomares e comam do seu fruto.",
     ctx:["Jeremias 29:11 é um dos versículos mais compartilhados do Brasil. Lido com o capítulo inteiro, ele fica ainda mais forte.",
          "A carta foi escrita a exilados na Babilônia. Deus mandou que eles vivessem ali, orassem pela cidade e esperassem setenta anos. A promessa de futuro vinha junto com a ordem de perseverar."],
     ask:"Qual versículo eu amo, mas nunca li dentro do seu capítulo?",
     act:"Escolha o seu versículo preferido e leia o capítulo inteiro onde ele está. O que mudou?",
     post:"Um versículo fora do contexto vira pretexto. Dentro do contexto, vira fundamento."},
    {title:"A poesia tem regras próprias", ref:"Salmo 23",
     key:"O Senhor é o meu pastor; nada me faltará.",
     ctx:["A poesia hebraica não rima sons, rima ideias. Uma linha repete ou completa a anterior. Isso se chama paralelismo.",
          "No Antigo Oriente, reis eram chamados de pastores do povo. Dizer que o Senhor é o meu pastor é dizer quem governa a minha vida e cuida dela."],
     ask:"Quem tem sido o pastor da minha vida nesta semana?",
     act:"Leia o Salmo 23 devagar e procure pares de linhas que dizem a mesma coisa com palavras diferentes.",
     post:"O Senhor é o meu pastor: quem governa a minha vida é quem cuida dela."},
    {title:"O mundo por trás do texto", ref:"Rute 2",
     key:"Rute foi colher espigas no campo, atrás dos ceifeiros.",
     ctx:["A lei de Israel mandava deixar as bordas do campo e as espigas caídas para o pobre, a viúva e o estrangeiro (Levítico 19:9-10). Rute era as três coisas.",
          "Boaz não estava apenas sendo gentil. Ele estava obedecendo à lei com generosidade, e mais tarde agiria como resgatador da família."],
     ask:"A minha fé aparece na forma como trato quem está à margem?",
     act:"Leia Rute 2 e marque cada atitude de Boaz que vai além do que a lei exigia.",
     post:"A fidelidade de Deus muitas vezes chega pelas mãos de alguém que obedece com generosidade."},
    {title:"Uma palavra que muda tudo", ref:"João 1:1-14",
     key:"O Verbo se fez carne e habitou entre nós.",
     ctx:["A palavra grega traduzida por \"habitou\" é skēnoō, ligada a skēnē, tenda. João está dizendo que o Verbo armou a sua tenda entre nós.",
          "Um leitor judeu lembraria do tabernáculo no deserto, a tenda onde a glória de Deus habitava no meio do povo. Agora essa glória tem rosto: Jesus."],
     ask:"Eu vejo Jesus como a presença de Deus perto de mim, ou distante?",
     act:"Leia João 1:1-14 e depois Êxodo 40:34-35. Anote o que os dois textos têm em comum.",
     post:"O Verbo armou a sua tenda entre nós. Deus não ficou longe."},
    {title:"Ler junto, examinar junto", ref:"Atos 17:10-12",
     key:"Receberam a palavra com toda avidez, examinando as Escrituras todos os dias.",
     ctx:["Os judeus de Bereia ouviram Paulo com alegria, mas não aceitaram tudo de olhos fechados. Iam às Escrituras todos os dias para conferir.",
          "Estudar a Bíblia nunca foi uma tarefa solitária. Os bereanos examinavam juntos, e Lucas chama isso de nobreza."],
     ask:"Com quem eu tenho examinado as Escrituras?",
     act:"Convide uma amiga para fazer a Semana 1 com você e conversem sobre o dia de hoje.",
     post:"Ouvir com alegria e examinar com seriedade. Foi assim em Bereia."}
  ]
};

const QUIZ = [
  {ref:"Jeremias 29:11", text:"Eu sei os planos que tenho para vocês, planos de paz e não de mal.", q:"A quem essa promessa foi feita primeiro?",
   opts:["A cada leitor, como promessa de sucesso pessoal imediato.","Aos judeus no exílio da Babilônia, que ainda esperariam setenta anos.","Aos sacerdotes do templo de Jerusalém."], right:1,
   why:"É uma carta a exilados. Deus promete restauração, mas depois de setenta anos. A esperança era coletiva e de longo prazo."},
  {ref:"Filipenses 4:13", text:"Tudo posso naquele que me fortalece.", q:"Sobre o que Paulo está falando?",
   opts:["Sobre vencer qualquer desafio ou meta.","Sobre os milagres dos apóstolos.","Sobre viver contente na fartura e na falta."], right:2,
   why:"Paulo escreve preso e acabou de dizer que aprendeu a viver com pouco e com muito (4:11-12)."},
  {ref:"Gênesis 1:27", text:"Criou Deus o ser humano à sua imagem.", q:"O que \"imagem\" comunicava no Antigo Oriente?",
   opts:["Semelhança física com Deus.","Representar o governo de Deus, como as estátuas que um rei erguia nas suas terras.","Uma honra reservada a reis e sacerdotes."], right:1,
   why:"Reis erguiam estátuas para marcar seu domínio. Gênesis dá esse título a todo ser humano, homem e mulher."},
  {ref:"Apocalipse 3:16", text:"Porque você é morno, nem frio nem quente.", q:"O que \"frio\" e \"quente\" significam?",
   opts:["Contra Deus e a favor de Deus.","Duas qualidades úteis da água: refrescar e curar.","Fé racional e fé emocional."], right:1,
   why:"Hierápolis tinha fontes termais e Colossos tinha água fria. A água de Laodiceia chegava morna e não servia para nada."},
  {ref:"Mateus 18:20", text:"Onde se reunirem dois ou três em meu nome, ali eu estou.", q:"Em que situação Jesus diz isso?",
   opts:["Ao ensinar como restaurar um irmão que pecou.","Para dizer que basta pouca gente para um culto.","Na última ceia."], right:0,
   why:"Os versículos 15 a 19 tratam de correção na comunidade, com testemunhas, como em Deuteronômio 19:15."}
];

const EXPLORE = [
  {t:"Cursos", d:"Como interpretar a Bíblia, Panorama do AT, O mundo de Jesus", s:"Fase 2"},
  {t:"Biblioteca infantil", d:"Histórias por idade: 3 a 5, 6 a 8, 9 a 12 e 13 a 16 anos", s:"Abrir prévia", lib:true},
  {t:"Jogos", d:"Memória, linha do tempo, quem disse? e caça-palavras", s:"Fase 3"},
  {t:"Mapa bíblico", d:"A crucificação em Jerusalém: lugares da época e de hoje", s:"Abrir prévia", map:true}
];

/* ================= ILUSTRAÇÕES (vetoriais, desenhadas por código) ================= */
const ART = (() => {
  const C = {sky:"#bfe0f2", sky2:"#e9f5fb", storm:"#7d8797", storm2:"#a8b0bc", night:"#1f2b55", dusk:"#f6d7a8",
    grass:"#9cc46b", grass2:"#7fae52", sand:"#e8cf98", sand2:"#d9b877", sea:"#4f8fc0", sea2:"#3a74a3",
    wood:"#9a6435", wood2:"#7a4a24", stone:"#b9b2a6", skin1:"#c48a5a", skin2:"#a8703f", skin3:"#d9a273",
    hair:"#3a2618", sun:"#f6c445", white:"#fbfaf7", ink:"#2b2230", gold:"#d9a93a", lapis:"#2f56b0"};
  const g=(t,inner)=>`<g transform="${t}">${inner}</g>`;
  const sky=(k="day")=>{
    const m={day:[C.sky,C.sky2],storm:[C.storm,C.storm2],night:[C.night,"#3b4a80"],dusk:["#f2b880",C.dusk],dawn:["#f5c9a0","#fde9cf"]}[k];
    return `<defs><linearGradient id="sk${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${m[0]}"/><stop offset="1" stop-color="${m[1]}"/></linearGradient></defs><rect width="400" height="260" fill="url(#sk${k})"/>`;
  };
  const sun=(x=330,y=50,r=24)=>`<circle cx="${x}" cy="${y}" r="${r+10}" fill="${C.sun}" opacity=".25"/><circle cx="${x}" cy="${y}" r="${r}" fill="${C.sun}"/>`;
  const rays=(x=200,y=-10)=>[...Array(7)].map((_,i)=>{const a=(-60+i*20)*Math.PI/180;return `<path d="M${x} ${y} L${x+Math.sin(a)*260-12} ${y+Math.cos(a)*260} L${x+Math.sin(a)*260+12} ${y+Math.cos(a)*260}Z" fill="${C.sun}" opacity=".22"/>`}).join("");
  const moon=(x=330,y=50)=>`<circle cx="${x}" cy="${y}" r="20" fill="#f3ead6"/><circle cx="${x+9}" cy="${y-6}" r="17" fill="${C.night}"/>`;
  const stars=()=>[[40,30],[90,60],[150,25],[220,50],[270,20],[380,80],[60,100],[300,95]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="1.8" fill="#fff"/>`).join("");
  const cloud=(x,y,s=1,f="#fff")=>g(`translate(${x} ${y}) scale(${s})`,`<g fill="${f}"><ellipse cx="0" cy="0" rx="30" ry="14"/><ellipse cx="-18" cy="4" rx="18" ry="11"/><ellipse cx="20" cy="5" rx="20" ry="11"/><ellipse cx="4" cy="-9" rx="18" ry="12"/></g>`);
  const rain=()=>[...Array(46)].map((_,i)=>{const x=(i*37)%410,y=(i*53)%200;return `<line x1="${x}" y1="${y}" x2="${x-6}" y2="${y+16}" stroke="#dfe8f2" stroke-width="2" stroke-linecap="round" opacity=".8"/>`}).join("");
  const hills=(c1=C.grass,c2=C.grass2,y=180)=>`<path d="M0 ${y} Q100 ${y-40} 200 ${y-5} T400 ${y-15} V260 H0Z" fill="${c2}"/><path d="M0 ${y+20} Q120 ${y-5} 240 ${y+15} T400 ${y+10} V260 H0Z" fill="${c1}"/>`;
  const ground=(c=C.grass,y=200)=>`<rect y="${y}" width="400" height="${260-y}" fill="${c}"/>`;
  const sea=(y=180)=>`<rect y="${y}" width="400" height="${260-y}" fill="${C.sea}"/>`+[0,1,2].map(r=>`<path d="${[...Array(9)].map((_,i)=>`M${i*50-10+(r%2)*20} ${y+12+r*24} q12 -8 25 0 t25 0`).join(" ")}" fill="none" stroke="${C.sea2}" stroke-width="3" stroke-linecap="round"/>`).join("");
  const rainbow=(cx=200,cy=230,r=170)=>["#e25b4a","#f19a3e","#f3cf4b","#7cbf5b","#4f8fd8","#7b5bb5"].map((c,i)=>`<path d="M${cx-r+i*12} ${cy} A${r-i*12} ${r-i*12} 0 0 1 ${cx+r-i*12} ${cy}" fill="none" stroke="${c}" stroke-width="12"/>`).join("");
  /* pessoa: x,y = pés */
  const person=(x,y,s=1,o={})=>{
    const robe=o.robe||"#c0563f", skin=o.skin||C.skin1, dark="rgba(0,0,0,.22)";
    const arm={down:[[-16,-20],[16,-20]],up:[[-22,-74],[22,-74]],out:[[-26,-42],[26,-42]],pray:[[-4,-50],[4,-50]],hold:[[-16,-20],[20,-36]]}[o.arms||"down"];
    const kneel=o.kneel;
    const body=kneel?`<path d="M-12 0 L-9 -36 L9 -36 L26 0Z" fill="${robe}"/>`:`<path d="M-14 0 L-10 -50 L10 -50 L14 0Z" fill="${robe}"/><path d="M-11 -30 H11" stroke="${dark}" stroke-width="3"/>`;
    const hy=kneel?-46:-60, sy=kneel?-34:-46;
    const coat=o.coat?`<path d="M-14 0 L-10 -50 L10 -50 L14 0Z" fill="none"/>${["#e25b4a","#f3cf4b","#4f8fd8","#7cbf5b"].map((c,i)=>`<rect x="-12" y="${-48+i*12}" width="24" height="12" fill="${c}"/>`).join("")}`:"";
    const arms=arm.map(([ax,ay])=>`<line x1="${ax<0?-8:8}" y1="${sy}" x2="${ax}" y2="${kneel&&o.arms==='pray'?-44:ay}" stroke="${robe}" stroke-width="6" stroke-linecap="round"/><circle cx="${ax}" cy="${kneel&&o.arms==='pray'?-44:ay}" r="3.6" fill="${skin}"/>`).join("");
    const head=`<circle cx="0" cy="${hy}" r="11" fill="${skin}"/>`+
      (o.wrap?`<path d="M-12 ${hy-1} Q0 ${hy-20} 12 ${hy-1} L13 ${hy+8} L9 ${hy+2} Q0 ${hy-8} -9 ${hy+2} L-13 ${hy+8}Z" fill="${o.wrap}"/>`:`<path d="M-11 ${hy-2} Q0 ${hy-18} 11 ${hy-2} Q6 ${hy-8} 0 ${hy-8} Q-6 ${hy-8} -11 ${hy-2}Z" fill="${o.hair||C.hair}"/>`)+
      (o.beard?`<path d="M-9 ${hy+3} Q0 ${hy+20} 9 ${hy+3} Q0 ${hy+9} -9 ${hy+3}Z" fill="${o.beard}"/>`:"")+
      `<circle cx="-4" cy="${hy}" r="1.4" fill="${C.ink}"/><circle cx="4" cy="${hy}" r="1.4" fill="${C.ink}"/>`+
      (o.sad?`<path d="M-3 ${hy+6} Q0 ${hy+3} 3 ${hy+6}" stroke="${C.ink}" stroke-width="1.3" fill="none"/>`:`<path d="M-3 ${hy+4} Q0 ${hy+7} 3 ${hy+4}" stroke="${C.ink}" stroke-width="1.3" fill="none"/>`)+
      (o.crown?`<path d="M-9 ${hy-10} L-9 ${hy-19} L-4 ${hy-14} L0 ${hy-21} L4 ${hy-14} L9 ${hy-19} L9 ${hy-10}Z" fill="${C.gold}"/>`:"")+
      (o.helmet?`<path d="M-12 ${hy-1} Q0 ${hy-22} 12 ${hy-1}Z" fill="#b08a3e"/><rect x="-1.5" y="${hy-24}" width="3" height="8" fill="#b08a3e"/>`:"");
    const staff=o.staff?`<line x1="20" y1="-82" x2="20" y2="0" stroke="${C.wood}" stroke-width="4" stroke-linecap="round"/><path d="M20 -82 q10 -2 8 10" stroke="${C.wood}" stroke-width="4" fill="none"/>`:"";
    const spear=o.spear?`<line x1="24" y1="-110" x2="24" y2="0" stroke="${C.wood2}" stroke-width="4"/><path d="M24 -124 L30 -108 L18 -108Z" fill="#9a9a9a"/>`:"";
    const hammer=o.hammer?`<line x1="20" y1="-36" x2="34" y2="-50" stroke="${C.wood2}" stroke-width="4"/><rect x="28" y="-60" width="14" height="8" fill="#777" transform="rotate(-45 35 -56)"/>`:"";
    const sling=o.sling?`<path d="M20 -36 Q34 -30 30 -14" stroke="${C.wood2}" stroke-width="2" fill="none"/><circle cx="30" cy="-12" r="3.5" fill="${C.stone}"/>`:"";
    const tilt=o.tilt?` rotate(${o.tilt})`:"";
    return g(`translate(${x} ${y}) scale(${s})${tilt}`,`<ellipse cx="4" cy="1" rx="18" ry="4" fill="rgba(0,0,0,.12)"/>${staff}${spear}${body}${coat}${arms}${head}${hammer}${sling}`);
  };
  const sheep=(x,y,s=1)=>g(`translate(${x} ${y}) scale(${s})`,`<line x1="-8" y1="-4" x2="-8" y2="6" stroke="${C.ink}" stroke-width="3"/><line x1="8" y1="-4" x2="8" y2="6" stroke="${C.ink}" stroke-width="3"/><g fill="#f7f4ec"><circle cx="-10" cy="-12" r="9"/><circle cx="2" cy="-16" r="10"/><circle cx="12" cy="-11" r="8"/><circle cx="0" cy="-6" r="9"/></g><ellipse cx="-20" cy="-14" rx="6" ry="7" fill="${C.ink}"/>`);
  const lion=(x,y,s=1,flip=1)=>g(`translate(${x} ${y}) scale(${s*flip} ${s})`,`<path d="M18 -14 q14 -4 12 -16" stroke="#c98a2e" stroke-width="3" fill="none"/><ellipse cx="4" cy="-14" rx="20" ry="11" fill="#e3a845"/><rect x="-12" y="-6" width="5" height="12" fill="#e3a845"/><rect x="12" y="-6" width="5" height="12" fill="#e3a845"/><circle cx="-16" cy="-22" r="14" fill="#b86f22"/><circle cx="-16" cy="-22" r="9" fill="#e9b65a"/><circle cx="-19" cy="-24" r="1.4" fill="${C.ink}"/><circle cx="-13" cy="-24" r="1.4" fill="${C.ink}"/><path d="M-18 -19 q2 2 4 0" stroke="${C.ink}" stroke-width="1.2" fill="none"/>`);
  const elephant=(x,y,s=1)=>g(`translate(${x} ${y}) scale(${s})`,`<ellipse cx="0" cy="-20" rx="24" ry="17" fill="#9aa3ad"/><rect x="-18" y="-8" width="8" height="14" fill="#9aa3ad"/><rect x="10" y="-8" width="8" height="14" fill="#9aa3ad"/><circle cx="-24" cy="-26" r="12" fill="#a9b1ba"/><path d="M-32 -22 q-6 14 0 22" stroke="#a9b1ba" stroke-width="6" fill="none" stroke-linecap="round"/><ellipse cx="-16" cy="-26" rx="8" ry="10" fill="#8a929c"/><circle cx="-28" cy="-29" r="1.4" fill="${C.ink}"/>`);
  const bird=(x,y,s=1,c="#fff")=>g(`translate(${x} ${y}) scale(${s})`,`<ellipse cx="0" cy="0" rx="9" ry="6" fill="${c}"/><circle cx="8" cy="-4" r="4.5" fill="${c}"/><path d="M12 -4 l5 1 -5 2z" fill="#f19a3e"/><path d="M-4 -2 q-6 -14 6 -8z" fill="${c}" stroke="rgba(0,0,0,.15)"/>`);
  const camel=(x,y,s=1)=>g(`translate(${x} ${y}) scale(${s})`,`${[-14,-6,8,16].map(lx=>`<rect x="${lx}" y="-14" width="4" height="20" fill="#b9874f"/>`).join("")}<ellipse cx="0" cy="-20" rx="22" ry="10" fill="#c99a5f"/><ellipse cx="2" cy="-30" rx="10" ry="9" fill="#c99a5f"/><path d="M-18 -22 Q-26 -38 -24 -46" stroke="#c99a5f" stroke-width="7" fill="none" stroke-linecap="round"/><ellipse cx="-28" cy="-47" rx="8" ry="5" fill="#c99a5f"/><rect x="-6" y="-38" width="14" height="10" fill="#8a4a7a"/>`);
  const ark=(x,y,s=1)=>g(`translate(${x} ${y}) scale(${s})`,`<path d="M-90 -30 L90 -30 L70 10 L-70 10Z" fill="${C.wood}"/><path d="M-84 -18 H84 M-78 -6 H78" stroke="${C.wood2}" stroke-width="2.5"/><rect x="-46" y="-66" width="92" height="36" fill="#b9814a"/><path d="M-54 -66 L0 -90 L54 -66Z" fill="${C.wood2}"/><rect x="-30" y="-56" width="14" height="12" fill="#5a3418"/><rect x="16" y="-56" width="14" height="12" fill="#5a3418"/>`);
  const arkHalf=(x,y,s=1)=>g(`translate(${x} ${y}) scale(${s})`,`<path d="M-90 -30 L20 -30 L20 10 L-70 10Z" fill="${C.wood}"/><path d="M-84 -18 H20 M-78 -6 H20" stroke="${C.wood2}" stroke-width="2.5"/>${[30,50,70].map(px=>`<rect x="${px}" y="-60" width="7" height="70" fill="#b9814a"/>`).join("")}`);
  const planks=(x,y)=>[0,1,2].map(i=>`<rect x="${x}" y="${y-i*8}" width="70" height="7" rx="2" fill="${i%2?C.wood:'#b9814a'}"/>`).join("");
  const stones=(x,y)=>[0,1,2,3,4].map(i=>`<ellipse cx="${x+i*13}" cy="${y+(i%2)*4}" rx="6" ry="4.5" fill="${C.stone}" stroke="#9a9286"/>`).join("");

function proj(b,W){const k=Math.cos((b.lat0+b.lat1)/2*Math.PI/180),H=W*(b.lat1-b.lat0)/((b.lon1-b.lon0)*k);
  return {H:Math.round(H),p:(lat,lon)=>[((lon-b.lon0)/(b.lon1-b.lon0)*W).toFixed(1),((b.lat1-lat)/(b.lat1-b.lat0)*H).toFixed(1)]};}
function fmtCoord(lat,lon){return `${lat.toFixed(4)}° N, ${lon.toFixed(4)}° L`;}

      <polygon points="${dead}" class="m-water"/><text x="${p(31.42,35.38)[0]}" y="${p(31.42,35.38)[1]}" class="m-w-t" text-anchor="end">${T?'Mar Salgado':'Mar Morto'}</text>

      ${R.places.map(pl=>{const [x,y]=p(pl.lat,pl.lon);return `<g class="m-pt ${pl.big?'big':''}" ${pl.id==='jer'?'data-go-city="1" tabindex="0" role="button"':''}><circle cx="${x}" cy="${y}" r="${pl.big?8:4.5}"/><text x="${+x+(pl.dx??8)}" y="${+y+(pl.dy??4)}" text-anchor="${pl.anchor||'start'}" class="${pl.small?'sm':''}">${T?pl.then:pl.now}</text></g>`}).join("")}
    </svg>`;
    info=`<div class="card"><p>${R.note[era]}</p><button class="btn" id="go-city">Ver Jerusalém e o caminho da cruz →</button>
      <ul class="plist">${R.places.map(pl=>`<li><strong>${pl.then}</strong><span>hoje: ${pl.now}</span><span class="co">${fmtCoord(pl.lat,pl.lon)}</span></li>`).join("")}</ul></div>`;
  } else {
    const Cc=MAP.city,{H,p}=proj(Cc.box,Cc.W),pts=a=>a.map(([x,y])=>p(x,y).join(",")).join(" ");
    const s=Cc.steps[mapv.sel];
    const [ox0,oy0]=p(31.786,35.2405);
    svg=`<svg viewBox="0 0 400 ${H}" class="map" role="img" aria-label="Mapa de Jerusalém">
      <rect width="400" height="${H}" class="m-land"/>
      <path d="M${ox0} 0 H400 V${H} H${p(31.7665,35.2400)[0]} Z" class="m-hill"/>
      <polyline points="${pts(Cc.kidron)}" class="m-valley"/><polyline points="${pts(Cc.hinnom)}" class="m-valley"/>
      ${!T?`<polygon points="${pts(Cc.wallNow)}" class="m-wall-now"/>`:''}
      <polygon points="${pts(Cc.wallThen)}" class="m-wall-then ${T?'':'faint'}"/>
      <polygon points="${pts(Cc.temple)}" class="m-temple"/>
      ${!T?`<polyline points="${pts(Cc.dolorosa)}" class="m-dolorosa"/>`:''}
      ${Cc.labels[era].map(([t,a,b,an])=>`<text x="${p(a,b)[0]}" y="${p(a,b)[1]}" class="${t===t.toUpperCase()?'m-area':'m-vt'}" text-anchor="${an||'middle'}">${t}</text>`).join("")}
      <polyline points="${Cc.steps.map(st=>p(st.lat,st.lon).join(",")).join(" ")}" class="m-route"/>
      ${s.alt?(()=>{const [ax,ay]=p(s.alt.lat,s.alt.lon);return `<g class="m-alt"><circle cx="${ax}" cy="${ay}" r="6"/><text x="${+ax+9}" y="${+ay+4}">${s.alt.label}</text></g>`})():''}
      ${Cc.steps.map((st,k)=>{const [x,y]=p(st.lat,st.lon);return `<g class="m-step ${k===mapv.sel?'on':''}" data-step="${k}" tabindex="0" role="button" aria-label="${st.n}. ${T?st.then:st.now}"><circle cx="${x}" cy="${y}" r="${k===4?13:11}"/>${k===4?`<path d="M${x} ${+y-7} V${+y+7} M${+x-5} ${+y-2.5} H${+x+5}" class="m-cross"/>`:`<text x="${x}" y="${+y+4.5}" text-anchor="middle">${st.n}</text>`}</g>`}).join("")}
    </svg>`;
    info=`<div class="legend">
        <span><i class="lg route"></i>Caminho da Paixão</span>
        <span><i class="lg then"></i>Muralha do séc. I (aprox.)</span>
        ${!T?`<span><i class="lg now"></i>Muralha atual</span><span><i class="lg dolo"></i>Via Dolorosa de hoje</span>`:''}
      </div>
      <article class="card stop">
        <div class="stop-h"><span class="badge">${s.n===5?'✝':s.n}</span><div><p class="eyebrow">${T?'Nome da época':'Onde fica hoje'}</p><h2>${T?s.then:s.now}</h2></div></div>
        <div class="pair"><div><span>Na época</span><strong>${s.then}</strong></div><div><span>Hoje</span><strong>${s.now}</strong></div></div>
        <p class="ref">${s.ref}</p>
        <p>${s.what}</p>
        <div class="sec"><h3>Hoje</h3><p>${s.today}</p></div>
        <div class="note"><b style="display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)">Grau de certeza</b>${s.sure}</div>
        <p class="co">${fmtCoord(s.lat,s.lon)} · <a href="https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lon}" target="_blank" rel="noopener">Abrir no mapa</a></p>
        <div class="pager"><button class="btn ghost" id="st-prev" ${mapv.sel===0?'disabled':''}>Anterior</button><span class="pg">${s.n} de 5</span><button class="btn" id="st-next" ${mapv.sel===4?'disabled':''}>Próximo</button></div>
      </article>`;
  }
  app.innerHTML = `${header()}
    <div><button class="btn ghost" id="map-close">← Explorar</button></div>
    <section class="hero"><p class="eyebrow">Mapa bíblico</p><h1>Onde Jesus foi crucificado</h1></section>
    ${eraBtns}${lvlBtns}
    <figure class="mapbox">${svg}<figcaption>Mapa esquemático. Posições aproximadas, sobre coordenadas reais.</figcaption></figure>
    ${info}`;
}

function quizRender(){
  if(qi>=QUIZ.length){
    if(qs>S.quizBest){S.quizBest=qs;save();}
    app.innerHTML = `${header()}<section class="hero"><p class="eyebrow">Você lê ou interpreta?</p><h1>${qs}/5 no contexto</h1></section>
      <div class="card"><p>${qs===5?'Você já lê com o contexto nas mãos.':qs>=3?'Você já desconfia da leitura apressada. Continue a trilha para ganhar método.':'Esses versículos são lidos fora de contexto em quase toda igreja. A trilha diária é um ótimo começo.'}</p>
      <p class="small">Seu melhor resultado: ${S.quizBest}/5</p>
      <button class="btn" id="q-again">Refazer</button></div>`;
    return;
  }
  const p = QUIZ[qi];
  app.innerHTML = `${header()}
    <div class="progress">${QUIZ.map((_,k)=>`<i class="${k<qi?'done':k===qi?'now':''}"></i>`).join("")}</div>
    <article class="card"><p class="ref">${p.ref}</p><blockquote>${p.text}</blockquote><p style="font-weight:600">${p.q}</p>
    <div class="opts">${p.opts.map((o,k)=>`<button class="opt" data-k="${k}" id="q${qi}-${k}"><span class="k">${"ABC"[k]}</span><span>${o}</span></button>`).join("")}</div>
    <div id="rev"></div></article>`;
}

function bind(){
  app.querySelectorAll("[data-done]").forEach(b=>b.onclick=()=>{const i=+b.dataset.done; if(!S.done.includes(i)){S.done.push(i);save();} render(); share(i);});
  app.querySelectorAll("[data-share]").forEach(b=>b.onclick=()=>share(+b.dataset.share));
  app.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{openDay=+b.dataset.open;render();window.scrollTo(0,0);});
  const back=document.getElementById("back"); if(back) back.onclick=()=>{openDay=null;render();};
  const gq=document.getElementById("go-quiz"); if(gq) gq.onclick=()=>{tab="quiz";qi=0;qs=0;render();};
  const $=id=>document.getElementById(id), go=f=>{f();render();window.scrollTo(0,0);};
  app.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{achCat=b.dataset.cat;render();});
  if($("open-map")) $("open-map").onclick=()=>go(()=>{mapv.open=true;});
  if($("map-close")) $("map-close").onclick=()=>go(()=>{mapv.open=false;});
  app.querySelectorAll("[data-era]").forEach(b=>b.onclick=()=>{mapv.era=b.dataset.era;render();});
  app.querySelectorAll("[data-lvl]").forEach(b=>b.onclick=()=>{mapv.level=b.dataset.lvl;render();});
  const toCity=()=>{mapv.level="city";render();};
  if($("go-city")) $("go-city").onclick=toCity;
  app.querySelectorAll("[data-go-city]").forEach(el=>{el.onclick=toCity;el.onkeydown=e=>{if(e.key==="Enter"||e.key===" ")toCity();};});
  app.querySelectorAll("[data-step]").forEach(el=>{const f=()=>{mapv.sel=+el.dataset.step;render();};el.onclick=f;el.onkeydown=e=>{if(e.key==="Enter"||e.key===" ")f();};});
  if($("st-prev")) $("st-prev").onclick=()=>{if(mapv.sel>0)mapv.sel--;render();};
  if($("st-next")) $("st-next").onclick=()=>{if(mapv.sel<4)mapv.sel++;render();};
  if($("open-lib")) $("open-lib").onclick=()=>go(()=>{lib.open=true;lib.book=null;});
  if($("lib-close")) $("lib-close").onclick=()=>go(()=>{lib.open=false;});
  if($("lib-back")) $("lib-back").onclick=()=>go(()=>{lib.book=null;});
  app.querySelectorAll("[data-age]").forEach(b=>b.onclick=()=>{lib.age=b.dataset.age;render();});
  app.querySelectorAll("[data-book]").forEach(b=>b.onclick=()=>go(()=>{lib.book=+b.dataset.book;lib.page=0;}));
  if($("pg-next")) $("pg-next").onclick=()=>{lib.page++;render();};
  if($("pg-prev")) $("pg-prev").onclick=()=>{if(lib.page>0)lib.page--;render();};
  if($("pg-restart")) $("pg-restart").onclick=()=>{lib.page=0;render();};
  const qa=document.getElementById("q-again"); if(qa) qa.onclick=()=>{qi=0;qs=0;render();};
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const p=QUIZ[qi], k=+b.dataset.k, ok=k===p.right; if(ok) qs++;
    app.querySelectorAll(".opt").forEach((o,idx)=>{o.disabled=true;o.classList.add(idx===p.right?'right':idx===k?'wrong':'dim');});
    document.getElementById("rev").innerHTML=`<p class="verdict ${ok?'ok':'no'}">${ok?'Isso mesmo.':'O contexto mostra outra coisa.'}</p><div class="note">${p.why}</div><button class="btn" id="q-next">${qi===QUIZ.length-1?'Ver resultado':'Próxima'}</button>`;
    document.getElementById("q-next").onclick=()=>{qi++;render();window.scrollTo(0,0);};
  });
}

document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{tab=t.dataset.t;openDay=null;lib.open=false;lib.book=null;mapv.open=false;if(tab==="quiz"&&qi>=QUIZ.length){qi=0;qs=0;}render();window.scrollTo(0,0);});

function bubble(x,X,Y,W,H,r,tail,fill){

    const lh=S.lh*(fs/S.fs); let y=S.top+S.bh/2-((lines.length-1)*lh)/2+fs*0.35-(o.ref?30:0);
    x.fillStyle=BRAND.terra; x.font=`800 ${fs*1.6}px Figtree, sans-serif`; x.fillText("“",W/2,y-lh-fs*0.2);
    x.fillStyle=BRAND.brown; x.font=`800 ${fs}px Figtree, sans-serif`;
    for(const l of lines){x.fillText(l,W/2,y);y+=lh;}
    if(o.ref){ x.fillStyle=BRAND.terraDeep; x.font='600 38px Figtree, sans-serif'; x.fillText(o.ref,W/2,y+30); }
  }
  /* logo */
  if(logo){ const lw=S.logoW, lh2=lw*logo.height/logo.width; x.drawImage(logo,W/2-lw/2,S.logoY,lw,lh2); }
  else { x.fillStyle=BRAND.brown; x.font='800 64px Figtree, sans-serif'; x.fillText("eu e a teologia",W/2,S.logoY+120); }
  /* selo do Instagram */
  x.font='700 34px Figtree, sans-serif'; const iw=x.measureText(IG).width+118, ix=W/2-iw/2, iy=S.ig-46;
  x.fillStyle=BRAND.terra; x.beginPath(); x.roundRect(ix,iy,iw,64,32); x.fill();
  x.strokeStyle="#fff"; x.lineWidth=3; x.beginPath(); x.roundRect(ix+28,iy+14,36,36,10); x.stroke();
  x.beginPath(); x.arc(ix+46,iy+32,8.5,0,Math.PI*2); x.stroke();
  x.fillStyle="#fff"; x.beginPath(); x.arc(ix+56,iy+22,2.6,0,Math.PI*2); x.fill();
  x.textAlign="left"; x.fillText(IG,ix+80,iy+44); x.textAlign="center";
  return c;
}
/* ================= CARD PARA STORIES (1080×1920) ================= */
if(window.CanvasRenderingContext2D && !CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h){this.rect(x,y,w,h);};
}
function wrapLines(ctx,text,maxW){
  const words=text.split(" "),lines=[];let line="";
  for(const w of words){const t=line?line+" "+w:w; if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w;} else line=t;}
  if(line) lines.push(line); return lines;
}
async function share(i){
  const d=WEEK.days[i];
  const c=await drawCard({eyebrow:`DIA ${i+1} · ${WEEK.title.split(" · ")[1].toUpperCase()}`, text:d.post, ref:d.ref});
  const url=c.toDataURL("image/png");
  const blob=await new Promise(r=>c.toBlob(r,"image/png"));
  const sh=document.createElement("div"); sh.className="sheet";
  sh.innerHTML=`<div class="in" role="dialog" aria-label="Card para postar">
    <p class="eyebrow">Seu card de hoje</p>
    <img src="${url}" alt="Card do dia ${i+1}: ${d.post}">
    <button class="btn block" id="native-share">Compartilhar imagem</button>
    <p class="small" id="share-msg" aria-live="polite">Abre a lista do celular com Instagram, WhatsApp, Facebook e as outras redes.</p>
    <div class="nets">
      <a class="net" id="net-wa" target="_blank" rel="noopener">WhatsApp</a>
      <a class="net" id="net-ig" href="https://www.instagram.com/eueateologia/" target="_blank" rel="noopener">Instagram</a>
      <a class="net" id="net-fb" target="_blank" rel="noopener">Facebook</a>
      <a class="net" id="net-tg" target="_blank" rel="noopener">Telegram</a>
    </div>
    <p class="small">Para os stories do Instagram: toque e segure a imagem para salvar e poste pelo app.</p>
    <button class="btn ghost block" id="copy-cap">Copiar legenda</button>
    <p class="small" id="cap-msg" aria-live="polite"></p>
    <button class="btn ghost block" id="close-sheet">Fechar</button></div>`;
  document.body.appendChild(sh);
  const cap=`Dia ${i+1} da trilha "${WEEK.title.split(" · ")[1]}" ✦ ${d.post} (${d.ref}) Siga ${IG} #euEaTeologia`;
  const link=APP_URL(), enc=encodeURIComponent;
  sh.querySelector("#net-wa").href=`https://wa.me/?text=${enc(cap+" "+link)}`;
  sh.querySelector("#net-fb").href=`https://www.facebook.com/sharer/sharer.php?u=${enc(link)}`;
  sh.querySelector("#net-tg").href=`https://t.me/share/url?url=${enc(link)}&text=${enc(cap)}`;
  sh.querySelector("#net-ig").onclick=()=>{ try{navigator.clipboard.writeText(cap).catch(()=>{});}catch(e){} };
  sh.querySelector("#native-share").onclick=async()=>{
    const m=sh.querySelector("#share-msg");
    const file=blob?new File([blob],`eu-e-a-teologia-dia-${i+1}.png`,{type:"image/png"}):null;
    try{
      if(file && navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],text:cap}); m.textContent="Pronto, imagem enviada para o compartilhamento."; }
      else if(navigator.share){ await navigator.share({text:cap,url:link}); m.textContent="Este aparelho compartilhou só o texto. Para a imagem, salve-a tocando e segurando."; }
      else throw new Error("sem suporte");
    }catch(e){
      if(e && e.name==="AbortError"){ m.textContent="Compartilhamento cancelado."; return; }
      m.textContent="Este navegador não abriu a lista de redes. Use os botões abaixo ou salve a imagem tocando e segurando.";
    }
  };
  sh.querySelector("#copy-cap").onclick=()=>{const m=sh.querySelector("#cap-msg");try{navigator.clipboard.writeText(cap).then(()=>m.textContent="Legenda copiada.").catch(()=>m.textContent=cap);}catch(e){m.textContent=cap}};
  sh.querySelector("#close-sheet").onclick=()=>sh.remove();
  sh.onclick=e=>{if(e.target===sh) sh.remove();};
}

render();
loadAchados();
</script>
