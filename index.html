<style>
/* Layout: uma coluna estreita, como um rolo aberto; cada passagem é uma "tabuinha" de estudo com o versículo em destaque e o contexto revelado abaixo */
:root{
  --bg:#f3f1ec;          /* papiro frio */
  --surface:#fbfaf7;
  --ink:#1c2238;         /* tinta índigo */
  --muted:#5d6278;
  --line:#dcd8cf;
  --lapis:#27408b;       /* lápis-lazúli do Antigo Oriente */
  --lapis-soft:#e4e8f4;
  --gold:#9a6f1e;        /* ouro envelhecido */
  --gold-soft:#f3ead6;
  --ok:#2f6b4a; --ok-soft:#e2efe7;
  --no:#9a3b2f; --no-soft:#f5e3df;
  --display:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12162a;--surface:#1a1f36;--ink:#ece9e1;--muted:#a3a7bb;--line:#2e3452;
  --lapis:#9db1ee;--lapis-soft:#232c52;--gold:#d9b366;--gold-soft:#2e2818;
  --ok:#8fd0aa;--ok-soft:#1b3328;--no:#eba196;--no-soft:#3a201c;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12162a;--surface:#1a1f36;--ink:#ece9e1;--muted:#a3a7bb;--line:#2e3452;
  --lapis:#9db1ee;--lapis-soft:#232c52;--gold:#d9b366;--gold-soft:#2e2818;
  --ok:#8fd0aa;--ok-soft:#1b3328;--no:#eba196;--no-soft:#3a201c;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;padding-inline:18px;padding-block:28px 56px}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.1;text-wrap:balance;margin:0}
p{margin:0}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px}
.brand b{font-family:var(--display);font-style:italic;font-size:22px;font-weight:600;color:var(--lapis)}
.brand span{font-size:13px;color:var(--muted)}

/* Intro */
.intro{display:flex;flex-direction:column;gap:18px}
.intro h1{font-size:clamp(40px,10vw,60px)}
.intro h1 em{color:var(--lapis)}
.intro .lede{font-size:18px;color:var(--muted);max-width:56ch}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.how div{border-top:2px solid var(--gold);padding-top:10px;font-size:14px;color:var(--muted)}
.how strong{display:block;color:var(--ink);font-size:15px}
@media (max-width:480px){.how{grid-template-columns:1fr}}

.btn{appearance:none;border:0;cursor:pointer;font:600 16px/1 var(--body);padding:16px 22px;border-radius:999px;background:var(--lapis);color:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;transition:transform .15s ease,opacity .15s}
:root[data-theme="dark"] .btn{color:var(--on-lapis,#1e1510)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:var(--on-lapis,#1e1510)}}
.btn:hover{transform:translateY(-1px)}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn.ghost{background:transparent;color:var(--lapis);border:1.5px solid var(--lapis)}
.btn[disabled]{opacity:.35;cursor:default;transform:none}

/* Progresso */
.progress{display:flex;gap:6px}
.progress i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.progress i.done{background:var(--lapis)}
.progress i.now{background:var(--gold)}

/* Passagem */
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:26px 22px;display:flex;flex-direction:column;gap:20px}
.ref{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.ref b{color:var(--gold);letter-spacing:.08em;text-transform:uppercase;font-size:12px}
blockquote{margin:0;font-family:var(--display);font-style:italic;font-size:clamp(26px,6.4vw,34px);line-height:1.2;font-weight:500;text-wrap:balance}
blockquote::before{content:"“";color:var(--gold)}
blockquote::after{content:"”";color:var(--gold)}
.q{font-weight:600;font-size:17px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{appearance:none;text-align:left;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:6px;padding:14px 16px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;transition:border-color .15s,background .15s}
.opt:hover:not([disabled]){border-color:var(--lapis)}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{color:var(--ok)}
.opt.wrong{border-color:var(--no);background:var(--no-soft)}
.opt.wrong .k{color:var(--no)}
.opt.dim{opacity:.55}

.reveal{border-top:1px solid var(--line);padding-top:18px;display:flex;flex-direction:column;gap:14px;animation:rise .35s ease}
.verdict{font-weight:700;font-size:15px}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--no)}
.ctx h3{font-size:24px;margin-bottom:6px;color:var(--lapis)}
.ctx p+p{margin-top:10px}
.note{background:var(--gold-soft);border-radius:6px;padding:14px 16px;font-size:15px}
.note b{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.next{align-self:flex-end}
@keyframes rise{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.reveal{animation:none}.btn{transition:none}}

/* Resultado */
.result{display:flex;flex-direction:column;gap:20px}
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.score .n{font-family:var(--display);font-size:72px;line-height:1;color:var(--lapis);font-weight:600;font-variant-numeric:tabular-nums}
.score .of{color:var(--muted)}
.result h2{font-size:clamp(32px,8vw,44px)}
.result .lede{font-size:17px;color:var(--muted)}
.learned{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.learned li{display:flex;gap:10px;font-size:15px;padding-block:8px;border-bottom:1px solid var(--line)}
.learned li span{color:var(--gold);font-weight:700;flex:none}
.invite{background:var(--lapis-soft);border-radius:6px;padding:24px 22px;display:flex;flex-direction:column;gap:14px}
.invite h3{font-size:28px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.copied{font-size:13px;color:var(--ok);min-height:1.2em}
.foot{font-size:13px;color:var(--muted);text-align:center}

/* ===== Identidade da logo: terracota, areia e marrom ===== */
:root{
  --bg:#faf6eb; --surface:#fffdf8; --ink:#3d2314; --muted:#7a5e4c; --line:#ead9c2;
  --lapis:#b0563a; --lapis-soft:#f6e5d6; --on-lapis:#fffdf8;
  --gold:#9a6a3e; --gold-soft:#f2dec3;
  --ok:#3f6b3a; --ok-soft:#e4efdc; --no:#a1402a; --no-soft:#f6e0d8;
  --display:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1e1510;--surface:#2a1d16;--ink:#f4e8d8;--muted:#c6ab95;--line:#402e23;
  --lapis:#e48b6b;--lapis-soft:#3b241a;--on-lapis:#1e1510;--gold:#e2b78c;--gold-soft:#3a2b1f;
  --ok:#9fd08f;--ok-soft:#203321;--no:#f0a08c;--no-soft:#3d1f17;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1e1510;--surface:#2a1d16;--ink:#f4e8d8;--muted:#c6ab95;--line:#402e23;
  --lapis:#e48b6b;--lapis-soft:#3b241a;--on-lapis:#1e1510;--gold:#e2b78c;--gold-soft:#3a2b1f;
  --ok:#9fd08f;--ok-soft:#203321;--no:#f0a08c;--no-soft:#3d1f17;color-scheme:dark}
h1,h2,h3{font-weight:800;letter-spacing:-.02em}
blockquote,.key{font-style:normal;font-weight:700;letter-spacing:-.01em}
.book.tiny .page-text,.cover strong,.tile strong,.bk .t strong{font-weight:800;letter-spacing:-.01em}
.logo{height:48px;width:auto;display:block}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo{background:#faf6eb;border-radius:10px;padding:4px 8px}}
:root[data-theme="dark"] .logo{background:#faf6eb;border-radius:10px;padding:4px 8px}
</style>

      "No Egito e na Mesopotâmia, reis erguiam estátuas suas nas regiões conquistadas para mostrar a quem aquela terra pertencia. A mesma palavra, tselem, é usada no Antigo Testamento para essas imagens. Em alguns textos, só o rei era chamado de imagem do deus.",
      "Gênesis faz algo surpreendente: dá esse título a todo ser humano, homem e mulher. Logo em seguida, no versículo 28, vem a tarefa de cuidar e governar a criação."
    ],
    take:"Ser imagem de Deus é uma dignidade e uma vocação: cada pessoa representa o Rei no mundo."
  },
  {
    ref:"Apocalipse 3:16",
    tag:"Carta à igreja de Laodiceia",
    text:"Assim, porque você é morno, nem frio nem quente, estou a ponto de vomitá-lo da minha boca.",
    q:"O que \"frio\" e \"quente\" significam aqui?",
    opts:[
      "Frio é a pessoa contra Deus, quente é a pessoa a favor. Melhor ser contra do que indiferente.",
      "São duas qualidades úteis da água. A igreja não servia nem para uma coisa nem para outra.",
      "Frio é a fé racional e quente é a fé emocional."
    ],
    right:1,
    title:"A água de Laodiceia",
    ctx:[
      "Laodiceia era uma cidade rica, mas sem fonte própria de água boa. A água chegava por um aqueduto e ficava morna e cheia de minerais. Perto dali, Hierápolis tinha fontes termais quentes, usadas para tratamento, e Colossos tinha água fria e fresca para beber.",
      "Água quente cura, água fria refresca. Água morna não serve para nada. Jesus não está dizendo que ser frio contra ele é melhor; está dizendo que a igreja tinha se tornado inútil."
    ],
    take:"A arqueologia da região ilumina a imagem: o chamado não é para ter mais emoção, é para voltar a ser útil no Reino."
  },
  {
    ref:"Mateus 18:20",
    tag:"Evangelho · discurso sobre a comunidade",
    text:"Pois onde se reunirem dois ou três em meu nome, ali eu estou no meio deles.",
    q:"Em que situação Jesus diz essa frase?",
    opts:[
      "Ao ensinar como tratar um irmão que pecou e como a comunidade deve decidir o caso.",
      "Para explicar que basta pouca gente para fazer um culto.",
      "Durante a última ceia, antes da prisão."
    ],
    right:0,
    title:"Um texto sobre restauração",
    ctx:[
      "Os versículos 15 a 19 tratam de um irmão que pecou: primeiro uma conversa a sós, depois com uma ou duas testemunhas, depois com a igreja. \"Duas ou três testemunhas\" vem da lei de Deuteronômio 19:15, usada para julgar com justiça.",
      "A promessa é que, quando a comunidade busca a restauração de alguém com seriedade, Cristo está presente e respalda essa decisão."
    ],
    take:"A presença de Cristo é sempre real entre os seus. Aqui ela aparece num momento difícil: quando a igreja precisa corrigir em amor."
  }
];

const RES = [
  {min:5,title:"Você interpreta com o contexto nas mãos.",text:"Acertou todas. Você já lê olhando o capítulo, a história e o primeiro público. A comunidade é o lugar para ir mais fundo: línguas, arqueologia e teologia sistemática."},
  {min:3,title:"Você já desconfia da leitura apressada.",text:"Acertou boa parte. Você percebe quando um versículo foi arrancado do lugar, mas ainda falta um método para chegar ao sentido com segurança."},
  {min:0,title:"Você acabou de começar a ler de verdade.",text:"Não tem problema nenhum. Esses versículos são lidos fora de contexto em quase toda igreja. O que você viu agora é só o começo do que o estudo sério da Bíblia abre."}
];

const app = document.getElementById("app");
let i = 0, score = 0;

function brand(){
  return `<div class="brand"><img class="logo" src="${LOGO_SRC}" alt="eu e a teologia, por juliana tasca"><span>teóloga · exegeta bíblica</span></div>`;
}

function intro(){
  app.innerHTML = `${brand()}
  <section class="intro">
    <p class="eyebrow">Degustação gratuita · 3 minutos</p>
    <h1>Você <em>lê</em> a Bíblia ou <em>interpreta</em>?</h1>
    <p class="lede">Cinco versículos que você já ouviu muitas vezes. Escolha o que acha que cada um significa e descubra o contexto histórico que muda a leitura.</p>
    <div class="how">
      <div><strong>5 passagens</strong>Profecia, carta, Torá, Evangelho e Apocalipse</div>
      <div><strong>Contexto real</strong>História, cultura e arqueologia do texto</div>
      <div><strong>Seu resultado</strong>E o próximo passo no estudo</div>
    </div>
    <div><button class="btn" id="go">Começar o teste</button></div>
  </section>`;
  document.getElementById("go").onclick = () => { i = 0; score = 0; question(); };
}

function progress(){
  return `<div class="progress" aria-label="Passagem ${i+1} de ${P.length}">${P.map((_,k)=>`<i class="${k<i?'done':k===i?'now':''}"></i>`).join("")}</div>`;
}

function question(){
  const p = P[i];
  app.innerHTML = `${brand()}${progress()}
  <article class="card">
    <div class="ref"><b>${p.ref}</b><span>${p.tag}</span></div>
    <blockquote>${p.text}</blockquote>
    <p class="q">${p.q}</p>
    <div class="opts">${p.opts.map((o,k)=>`<button class="opt" data-k="${k}" id="opt-${i}-${k}"><span class="k">${"ABC"[k]}</span><span>${o}</span></button>`).join("")}</div>
    <div id="rev"></div>
  </article>`;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.k));
  window.scrollTo({top:0,behavior:"smooth"});
}

function answer(k){
  const p = P[i], ok = k === p.right;
  if (ok) score++;
  app.querySelectorAll(".opt").forEach((b,idx) => {
    b.disabled = true;
    if (idx === p.right) b.classList.add("right");
    else if (idx === k) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const last = i === P.length - 1;
  const rev = document.getElementById("rev");
  rev.innerHTML = `<div class="reveal">
    <p class="verdict ${ok?'ok':'no'}">${ok?'Isso mesmo.':'Essa é a leitura mais comum, mas o contexto mostra outra coisa.'}</p>
    <div class="ctx"><h3>${p.title}</h3>${p.ctx.map(t=>`<p>${t}</p>`).join("")}</div>
    <div class="note"><b>Para levar</b>${p.take}</div>
    <button class="btn next" id="nx">${last?'Ver meu resultado':'Próxima passagem'}</button>
  </div>`;
  document.getElementById("nx").onclick = () => { i++; last ? result() : question(); };
  rev.scrollIntoView({behavior:"smooth",block:"start"});
}

function result(){
  const r = RES.find(x => score >= x.min);
  app.innerHTML = `${brand()}
  <section class="result">
    <div class="score"><span class="n">${score}/5</span><span class="of">passagens interpretadas no contexto</span></div>
    <h2>${r.title}</h2>
    <p class="lede">${r.text}</p>
    <div>
      <p class="eyebrow" style="margin-bottom:8px">O que você viu em 3 minutos</p>
      <ul class="learned">${P.map(p=>`<li><span>${p.ref}</span>${p.title}</li>`).join("")}</ul>
    </div>
    <div class="invite">
      <h3>Agora imagine fazer isso com a Bíblia inteira.</h3>
      <p>Na comunidade eu e a teologia, a Juliana ensina mulheres a interpretar as Escrituras com história, arqueologia do Antigo Oriente e exegese, em linguagem clara e com comunhão entre irmãs.</p>
      <div class="actions">
        <a class="btn" href="${SALES_URL}" target="_blank" rel="noopener">Quero entrar na comunidade</a>
        <button class="btn ghost" id="share">Copiar convite para uma amiga</button>
      </div>
      <p class="copied" id="copied" aria-live="polite"></p>
    </div>
    <div><button class="btn ghost" id="again">Refazer o teste</button></div>
    <p class="foot">Citações bíblicas em tradução livre, para estudo.</p>
  </section>`;
  document.getElementById("again").onclick = intro;
  document.getElementById("share").onclick = () => {
    const msg = `Fiz ${score}/5 no teste "Você lê ou interpreta?" da Juliana Tasca. Faz também e me conta: ${location.href}`;
    const out = document.getElementById("copied");
    try{
      navigator.clipboard.writeText(msg).then(()=>{out.textContent="Convite copiado. É só colar no WhatsApp."})
      .catch(()=>{out.textContent=msg});
    }catch(e){out.textContent=msg}
  };
  window.scrollTo({top:0,behavior:"smooth"});
}

intro();
</script>

</body>
</html>
